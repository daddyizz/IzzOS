name: UEFI Ovaltine Diagnostic

on:
  push:
    branches:
      - izzos-woa-foundation
    paths:
      - 'uefi/**'
      - 'scripts/**'
      - '.github/workflows/uefi-ovaltine-diag.yml'
  pull_request:
    paths:
      - 'uefi/**'
      - 'scripts/**'
      - '.github/workflows/uefi-ovaltine-diag.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout IzzOS
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Test device capability analyzer
        run: bash scripts/test-analyze-ovaltine-inspection.sh

      - name: Test diagnostic output analyzer
        run: bash scripts/test-analyze-ovaltine-diag.sh

      - name: Test stock boot metadata analyzer
        run: bash scripts/test-analyze-stock-boot-metadata.sh

      - name: Test stock image provenance gate
        run: bash scripts/test-verify-stock-image-provenance.sh

      - name: Test stock provenance generator round trip
        run: bash scripts/test-stock-image-provenance-roundtrip.sh

      - name: Enforce M1 read-only safety gate
        run: bash scripts/check-m1-safety.sh

      - name: Install AArch64 EDK2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acpica-tools \
            gcc-aarch64-linux-gnu \
            git \
            make \
            nasm \
            python3 \
            uuid-dev

      - name: Build OvaltineDiag
        run: bash scripts/build-ovaltine-diag.sh

      - name: Verify OvaltineDiag artifact
        run: bash scripts/verify-ovaltine-diag.sh

      - name: Verify route-neutral M2 staging
        run: |
          rm -rf .work/m2-staging-test
          bash scripts/prepare-m2-staging.sh \
            out/ovaltine-diag/OvaltineDiag.efi \
            .work/m2-staging-test \
            CI-UNVALIDATED
          MANIFEST=.work/m2-staging-test/CI-UNVALIDATED/manifest.txt
          DERIVED=.work/m2-staging-test/CI-UNVALIDATED/derived
          grep -q '^Selected launch route: NONE$' "$MANIFEST"
          grep -q '^Route decision: INSUFFICIENT_DEVICE_DATA$' "$MANIFEST"
          grep -q '^Persistent writes: FORBIDDEN$' "$MANIFEST"
          grep -q '^Slot changes: FORBIDDEN$' "$MANIFEST"
          test -z "$(find "$DERIVED" -mindepth 1 -print -quit)"

      - name: Upload diagnostic EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OvaltineDiag-AARCH64
          path: out/ovaltine-diag/
          if-no-files-found: error
